name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            zip unzip wget curl git \
            autoconf automake libtool pkg-config cmake ninja-build ccache \
            zlib1g-dev libffi-dev libssl-dev libreadline-dev libncurses-dev \
            libltdl-dev gettext libjpeg-dev libpng-dev libfreetype-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython

      - name: Build APK with buildozer
        working-directory: android
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qaziurduposter-preview
          path: android/bin/*.apk

      - name: Upload Android log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            android/.buildozer/android/platform/build-*/*/*.log
            android/.buildozer/logs/*