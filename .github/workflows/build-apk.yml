name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip unzip openjdk-17-jdk libgl1 libgl1-mesa-dev libgles2-mesa \
            libgles2-mesa-dev libegl1 libegl1-mesa libdrm2 libxkbcommon0 libglib2.0-0 \
            autoconf automake libtool pkg-config cmake ninja-build git ccache \
            zlib1g-dev libffi-dev gettext libltdl-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython
          sudo apt-get install -y python3-pip python3-venv

      - name: Build APK with buildozer
        working-directory: android
        run: |
          export JAVA_HOME=/usr/lib/jvm/temurin-17-jdk-amd64
          export PATH=$JAVA_HOME/bin:$PATH
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qaziurduposter-preview
          path: android/bin/*.apk

      - name: Upload Android log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-logs
          path: |
            android/.buildozer/android/platform/build-*/*/*.log
            android/.buildozer/logs/*